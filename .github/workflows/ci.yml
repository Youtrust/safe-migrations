name: CI

on:
  pull_request:
  push:
    branches:
      - 'main'

env:
  COMPOSER_UPDATE_FLAGS: "--no-interaction --no-progress --prefer-dist "

jobs:
  tests:
    runs-on: ubuntu-latest
    name: Test
    strategy:
      fail-fast: false
      matrix:
        include:
          # --prefer-lowest keeps DBAL 3 covered; every other row resolves to DBAL 4.
          - php: 8.3
            composer_update_flags: --prefer-lowest
          - php: 8.3
          # Symfony 8 needs PHP 8.4, so this is where that support is actually exercised.
          - php: 8.4
          - php: 8.5
    steps:
      - uses: actions/checkout@v2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php }}"
          coverage: none

      - name: Composer dependencies
        run: COMPOSER_UPDATE_FLAGS+="${{matrix.composer_update_flags}}" make vendor

      - name: Lint
        run: find . -name '*.php' -path './src/*' | parallel -j 4 php -l {}

      - name: PHPUnit
        run: make phpunit

  static-analysis:
    runs-on: ubuntu-latest
    name: Static analysis

    steps:
      - uses: actions/checkout@v2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"

      - name: Composer dependencies
        run: make vendor

      - name: Composer validate
        run: make composer-validate

      - name: PHPStan
        run: make phpstan

      - name: PHP CS Fixer
        run: make php-cs-fixer-check
